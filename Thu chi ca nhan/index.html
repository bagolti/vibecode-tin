<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>Sổ Thu Chi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: một cột trên điện thoại; thẻ 3 cột + biểu đồ 2 cột ở máy tính bảng; ≥1280px chia 2 cột (tổng quan | danh sách). Token lấy từ DESIGN.md. */
:root{
  --primary:#2F6FED;--primary-contrast:#FFFFFF;
  --income:#12805C;--income-soft:#E3F5EE;
  --expense:#C8421E;--expense-soft:#FCEBE5;
  --danger:#B3261E;--warning:#8A6100;
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#EEF0F4;--border:#DDE1E8;--text:#14181F;--text-muted:#5B6472;
  --cat-1:#E8743B;--cat-2:#2F6FED;--cat-3:#7A5AF8;--cat-4:#D9468F;--cat-5:#E0A100;--cat-6:#12805C;--cat-7:#0E9AA7;--cat-8:#7B8494;
  --scrim:rgba(10,14,22,.5);
  --shadow-1:0 1px 2px rgba(16,24,40,.06);--shadow-2:0 4px 12px rgba(16,24,40,.10);--shadow-3:0 16px 40px rgba(16,24,40,.18);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:999px;
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:400ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);
  --font:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:16px;
}
@media (min-width:640px){:root{--gutter:24px}}
@media (min-width:1024px){:root{--gutter:32px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#6C9BFF;--primary-contrast:#0B1220;--income:#3DD598;--income-soft:#12372C;--expense:#FF8A65;--expense-soft:#3F2219;
  --danger:#F2766D;--warning:#F2C14E;--bg:#0F1115;--surface:#181B21;--surface-2:#222630;--border:#2E3340;--text:#ECEFF4;--text-muted:#A0A8B6;
  --cat-1:#FF9A66;--cat-2:#6C9BFF;--cat-3:#A58BFF;--cat-4:#F07DB5;--cat-5:#F2C14E;--cat-6:#3DD598;--cat-7:#4FD1DB;--cat-8:#9AA3B2;
  --shadow-1:0 0 0 rgba(0,0,0,0);--shadow-2:0 4px 12px rgba(0,0,0,.4);--shadow-3:0 16px 40px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#6C9BFF;--primary-contrast:#0B1220;--income:#3DD598;--income-soft:#12372C;--expense:#FF8A65;--expense-soft:#3F2219;
  --danger:#F2766D;--warning:#F2C14E;--bg:#0F1115;--surface:#181B21;--surface-2:#222630;--border:#2E3340;--text:#ECEFF4;--text-muted:#A0A8B6;
  --cat-1:#FF9A66;--cat-2:#6C9BFF;--cat-3:#A58BFF;--cat-4:#F07DB5;--cat-5:#F2C14E;--cat-6:#3DD598;--cat-7:#4FD1DB;--cat-8:#9AA3B2;
  --shadow-1:0 0 0 rgba(0,0,0,0);--shadow-2:0 4px 12px rgba(0,0,0,.4);--shadow-3:0 16px 40px rgba(0,0,0,.55);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:24px;
  padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text-muted)}
.cap{font-size:13px;line-height:18px;font-weight:500}
.over{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-size:24px;line-height:32px;font-weight:700}
.h2{font-size:18px;line-height:26px;font-weight:600}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--radius-md);font-weight:600;white-space:nowrap;
  transition:background var(--dur-fast),transform var(--dur-fast),opacity var(--dur-fast)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-contrast);min-height:48px}
.btn.secondary{background:var(--surface-2);color:var(--text)}
.btn.ghost{color:var(--text);min-height:44px}
.btn.ghost:hover,.icon-btn:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger);min-height:48px}
.btn.danger-solid{background:var(--danger);color:#fff;min-height:48px}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 12px}
.icon-btn{width:44px;height:44px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);transition:background var(--dur-fast),color var(--dur-fast)}
.icon-btn:hover{color:var(--text)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}

/* Header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
  margin-left:calc(-1*max(var(--gutter),env(safe-area-inset-left,0px)));margin-right:calc(-1*max(var(--gutter),env(safe-area-inset-right,0px)));
  padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.hd-in{height:56px;display:flex;align-items:center;gap:8px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;line-height:26px;margin-right:auto;min-width:0}
.brand span{white-space:nowrap}
.hd-right{display:flex;align-items:center;gap:4px}
.chip-off{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);padding:4px 10px;border-radius:var(--radius-full);font-size:13px;font-weight:500}
.chip-off i{width:8px;height:8px;border-radius:50%;background:var(--warning)}
.searchbox{display:none;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--radius-full);height:44px;padding:0 6px 0 14px;width:200px;transition:width var(--dur-base) var(--ease-out)}
.searchbox:focus-within{width:300px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:100%}
.searchbox input::placeholder{color:var(--text-muted)}
.searchbox:focus-within{outline:2px solid var(--primary);outline-offset:2px}
.searchbox .icon-btn{width:32px;height:32px}
.searchbox .back{display:none}
.lbl{display:none}
.add-desk{display:none}
.mp-mob{margin:8px 0 0}
#sbtn{display:inline-flex}
body.search-open .brand,body.search-open #sbtn,body.search-open .hd-right>.btn,body.search-open .chip-off{display:none!important}
body.search-open .hd-right{flex:1}
body.search-open .searchbox{display:flex;width:100%!important;padding-left:4px}
body.search-open .searchbox .back{display:inline-flex}
body.search-open .searchbox>.ic{display:none}
@media (min-width:640px){
  .searchbox{display:flex}#sbtn{display:none}.lbl{display:inline}
}
@media (min-width:1024px){
  .hd .mp.mp-desk{display:flex;margin:0 auto}
  .brand{margin-right:0}body .mp.mp-mob{display:none}.add-desk{display:inline-flex}
  .searchbox{width:200px}.searchbox:focus-within{width:260px}
}

/* Bộ chọn tháng */
.mp{display:flex;align-items:center;justify-content:center;gap:4px}
.mp.mp-desk{display:none}
[hidden]{display:none!important}
.mp .mlabel{min-height:44px;padding:0 12px;border-radius:var(--radius-md);font-size:18px;font-weight:600;line-height:26px}
.mp .mlabel:hover{background:var(--surface-2)}

.wrap{max-width:1120px;margin:0 auto;padding-block:8px 112px}
.layout{display:flex;flex-direction:column;gap:24px}
.col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-list{min-width:0}
#banners{display:flex;flex-direction:column;gap:12px;margin-top:8px}
#banners:empty{display:none}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--radius-md);padding:12px 16px;border-left:4px solid var(--warning)}
.banner.err{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.banner .bt{flex:1 1 220px;min-width:0;display:flex;gap:10px}
.banner .ba{display:flex;gap:4px;margin-left:auto}
.banner.info{border-left-color:var(--primary)}

/* Thẻ */
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px 20px;min-width:0}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .col-list-card{border:1px solid var(--border)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .col-list-card{border:1px solid var(--border)}}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum .card{display:flex;flex-direction:column;gap:4px}
.sum .lab{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;line-height:18px;font-weight:500}
.sum .val{font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum .bal{grid-column:1/-1;order:-1}
.sum .bal .val{font-size:32px;line-height:40px}
.sum.dim .val{opacity:.6}
@media (min-width:640px){.sum{grid-template-columns:repeat(3,1fr)}.sum .bal{grid-column:auto;order:0}.sum .bal .val,.sum .val{font-size:24px;line-height:32px}}
.pos{color:var(--income)}.neg{color:var(--expense)}

.charts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.charts .card{padding:16px}
.ch-head{display:flex;align-items:center;gap:4px 6px;margin-bottom:8px;flex-wrap:wrap}
.ch-head .h2{margin-right:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--radius-full);padding:3px;gap:2px}
.seg button{min-height:34px;padding:0 11px;border-radius:var(--radius-full);font-size:14px;font-weight:600;color:var(--text-muted);position:relative}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-contrast)}
.seg.touch button::after{content:"";position:absolute;inset:-5px 0}
.seg.full{display:flex;width:100%;border-radius:var(--radius-md);padding:4px}
.seg.full button{flex:1;min-height:40px;border-radius:var(--radius-sm)}
.seg.type button[aria-checked="true"].t-expense{background:var(--expense-soft);color:var(--expense)}
.seg.type button[aria-checked="true"].t-income{background:var(--income-soft);color:var(--income)}
.seg.type button[aria-checked="true"]{box-shadow:inset 0 0 0 1px currentColor}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.donut{width:180px;height:180px;position:relative;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .seg-c{fill:none;stroke-width:28;transition:opacity var(--dur-fast);cursor:pointer}
.donut:hover .seg-c:not(:hover){opacity:.55}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 30px}
.donut .mid b{font-size:15px;line-height:22px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.legend{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column}
.legend li{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px;line-height:20px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{width:48px;text-align:right;color:var(--text-muted)}
.legend .am{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.barwrap{overflow-x:auto;overscroll-behavior-x:contain}
.barwrap svg{display:block}
.ax{fill:var(--text-muted);font-size:12px;font-family:var(--font)}
.grid-l{stroke:var(--border);stroke-width:1}
.bar-hit{fill:transparent}
.bar-hit:hover{fill:var(--surface-2);opacity:.7}
.key{display:flex;gap:16px;font-size:13px;font-weight:500;margin-bottom:4px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tbl-wrap{overflow:auto;max-height:320px}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding:8px 8px;border-bottom:1px solid var(--border)}
.tbl td{padding:0 8px;height:48px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tr.tot td{font-weight:700}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px}
.empty p{margin:0;max-width:280px}
.empty-sm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px}
.empty-sm .t{flex:1 1 200px;display:flex;gap:10px;align-items:center}
.skeleton{background:var(--surface-2);border-radius:var(--radius-md)}

/* Danh sách */
.listcard{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px 16px 8px;min-width:0}
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lhead .h2{margin-right:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;margin:4px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:var(--radius-full);background:var(--surface-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-contrast)}
.chip.x{background:var(--surface-2)}
.badge{min-width:20px;height:20px;border-radius:var(--radius-full);background:var(--primary);color:var(--primary-contrast);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.lsum{padding:4px 0 8px}
.day{margin-top:8px}
.dayhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 0 4px}
.dayhd .net{font-size:13px;line-height:18px;font-weight:500;font-variant-numeric:tabular-nums}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--border)}
.swipe-act{position:absolute;inset:0 0 0 auto;display:flex}
.swipe-act button{width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:13px;font-weight:600}
.swipe-act .e{background:var(--primary);color:var(--primary-contrast)}
.swipe-act .d{background:var(--danger);color:#fff}
.row{position:relative;background:var(--surface);display:flex;align-items:center;transition:transform 160ms var(--ease-out);touch-action:pan-y}
.row.drag{transition:none}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;text-align:left}
.cico{width:40px;height:40px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;flex:none;
  background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.rtx b{font-weight:500;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtx small{font-size:13px;line-height:18px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ramt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rtools{display:none;align-items:center}
@media (hover:hover) and (min-width:1024px){
  .rtools{display:flex;opacity:0;position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--surface);transition:opacity var(--dur-fast)}
  .row:hover .ramt,.row:focus-within .ramt{margin-right:92px}
  .row:hover .rtools,.row:focus-within .rtools{opacity:1}
  .row:hover{background:color-mix(in srgb,var(--text) 4%,var(--surface))}
}
@keyframes flash{from{background:color-mix(in srgb,var(--primary) 10%,var(--surface))}to{background:var(--surface)}}
.row.new{animation:flash 1.2s ease-out}
mark{background:color-mix(in srgb,var(--primary) 15%,transparent);color:inherit;border-radius:3px}
.ghost-link{color:var(--primary);font-weight:600;min-height:44px;padding:0 8px}

/* FAB / Toast / Tooltip */
.fab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  background:var(--primary);color:var(--primary-contrast);box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;transition:transform var(--dur-fast)}
.fab:active{transform:scale(.94)}
@media (min-width:640px){.fab{right:max(24px,env(safe-area-inset-right,0px))}}
@media (min-width:1024px){.fab{display:none}}
.toast{position:fixed;z-index:40;left:50%;transform:translate(-50%,16px);bottom:calc(88px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);
  transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ta{color:var(--bg);font-weight:700;text-decoration:underline;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
@media (min-width:1024px){.toast{bottom:32px}}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-2);border-radius:var(--radius-md);padding:8px 12px;font-size:13px;line-height:18px;max-width:240px}
.tip b{display:block;font-weight:600}

/* Lớp phủ: sheet / panel / modal / dialog / popover */
.layer{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade var(--dur-base) var(--ease-out)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.98)}}
@keyframes right{from{transform:translateX(100%)}}
.panel{position:absolute;background:var(--surface);color:var(--text);box-shadow:var(--shadow-3);display:flex;flex-direction:column;overflow:hidden}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px 20px;flex:none}
.panel-bd{padding:8px 20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.panel-ft{padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:12px;flex:none;background:var(--surface)}
.panel-ft .btn{flex:1}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0;flex:none}
/* phone (mặc định) */
.L-sheet .panel{inset:0;animation:up var(--dur-base) var(--ease-out);padding-top:env(safe-area-inset-top,0px)}
.L-sheet .grab{display:none}
.L-panel .panel,.L-modal .panel,.L-pop .panel{left:0;right:0;bottom:0;max-height:90%;border-radius:var(--radius-xl) var(--radius-xl) 0 0;animation:up var(--dur-base) var(--ease-out)}
.L-panel .panel{height:90%}
.L-pop .panel{max-height:75%}
.L-dialog{display:flex;align-items:center;justify-content:center;padding:16px}
.L-dialog .panel{position:relative;width:min(100%,360px);border-radius:var(--radius-xl);padding:20px;gap:12px;animation:pop var(--dur-base) var(--ease-out)}
.L-dialog .btns{display:flex;gap:12px;margin-top:8px}
.L-dialog .btns .btn{flex:1}

/* Form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.fl{font-size:13px;line-height:18px;font-weight:500;color:var(--text-muted)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);font-size:16px;outline:none}
.input:focus{outline:2px solid var(--primary);outline-offset:2px}
textarea.input{padding:10px 14px;resize:none;min-height:72px;line-height:24px}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-md);padding:0 16px;min-height:72px}
.amt:focus-within{border-color:var(--cl);outline:2px solid var(--cl);outline-offset:2px}
.amt input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:32px;line-height:40px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.amt span{font-size:24px;font-weight:600;color:var(--text-muted)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catb{min-height:72px;border-radius:var(--radius-md);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:13px;line-height:16px;font-weight:500;text-align:center;position:relative;background:var(--surface)}
.catb .cico{width:32px;height:32px}
.catb[aria-checked="true"]{border-color:var(--primary);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--primary)}
.catb .tick{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--primary);color:var(--primary-contrast);display:none;align-items:center;justify-content:center}
.catb[aria-checked="true"] .tick{display:flex}
.err{display:flex;gap:6px;align-items:center;color:var(--danger);font-size:13px;line-height:18px;font-weight:500;margin:0}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.shake{animation:shake 200ms}
.quick{display:flex;gap:8px}
.meta{font-size:13px;line-height:18px;color:var(--text-muted)}
.count{font-size:13px;color:var(--text-muted);text-align:right}
.hint{color:var(--warning)}

/* Cài đặt */
.grp{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 4px;border-radius:var(--radius-md);text-align:left;width:100%}
.arow:hover{background:var(--surface-2)}
.arow span{flex:1}
.note{display:flex;gap:10px;background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px;font-size:13px;line-height:18px}
.radio{display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);text-align:left;width:100%}
.radio[aria-checked="true"]{border-color:var(--primary);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--primary)}
.radio .rb{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.radio[aria-checked="true"] .rb{border-color:var(--primary);background:var(--primary);color:var(--primary-contrast)}
.drop{border:2px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface-2);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}

.prev{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:var(--radius-md);padding:12px 14px}
.prev .li{display:flex;gap:8px;align-items:center;font-size:14px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:18px;min-height:96px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcell{min-height:48px;border-radius:var(--radius-sm);font-weight:500;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mcell:hover:not(:disabled){background:var(--surface-2)}
.mcell:disabled{opacity:.4;cursor:not-allowed}
.mcell.cur{box-shadow:inset 0 0 0 1px var(--primary)}
.mcell.sel{background:var(--primary);color:var(--primary-contrast)}
.mcell i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.yr{display:flex;align-items:center;justify-content:space-between}

function validTx(t){return t&&(t.type==='income'||t.type==='expense')&&Number.isInteger(t.amount)&&t.amount>0&&CAT[t.category]&&CAT[t.category].type===t.type&&/^\d{4}-\d{2}-\d{2}$/.test(t.date);}

  var by={};a.filter(function(t){return t.type==='expense';}).forEach(function(t){by[t.category]=(by[t.category]||0)+t.amount;});
  var tot=sum(Object.keys(by),function(k){return by[k];});if(!tot)return {tot:0,seg:[]};
  var seg=[],other=0;
  Object.keys(by).forEach(function(k){if(k!=='khac-chi'&&by[k]/tot<.03)other+=by[k];else if(k==='khac-chi')other+=by[k];else seg.push({id:k,amt:by[k]});});
  seg.sort(function(x,y){return y.amt-x.amt;});if(other)seg.push({id:'khac-chi',amt:other});
  seg.forEach(function(s){s.pct=s.amt/tot*100;});return {tot:tot,seg:seg};
}

    '<div class="mid"><span class="cap muted">Tổng chi</span><b title="'+fmt(D.tot)+'">'+compact(D.tot)+'</b></div></div>'+
    '<ul class="legend">'+D.seg.map(function(s){return '<li><span class="dot" style="background:var(--cat-'+CAT[s.id].c+')"></span><span class="nm">'+esc(CAT[s.id].name)+'</span><span class="am">'+fmt(s.amt)+'</span><span class="pc">'+s.pct.toFixed(0)+'%</span></li>';}).join('')+'</ul></div></div>';

/* ===== Lớp phủ ===== */
var stack=[];
function openLayer(kind,html,o){
  o=o||{};var L=document.createElement('div');L.className='layer L-'+kind;
  L.innerHTML='<div class="scrim" data-action="scrim"></div><div class="panel" role="dialog" aria-modal="true"'+(o.label?' aria-labelledby="'+o.label+'"':'')+(o.anchor&&innerWidth>=640?' style="--pl:'+o.pl+'px;--pt:'+o.pt+'px"':'')+'>'+(kind==='panel'||kind==='modal'||kind==='pop'?'<div class="grab"></div>':'')+html+'</div>';
  var rec={el:L,kind:kind,from:document.activeElement,onClose:o.onClose,guard:o.guard};
  $('#layers').appendChild(L);stack.push(rec);
  var f=$(o.focus||'[data-autofocus]',L)||$('button,input,textarea',$('.panel',L));if(f)setTimeout(function(){try{f.focus({preventScroll:true});}catch(e){}},30);
  document.body.style.overflow='hidden';
  return rec;
}
function closeLayer(rec,force){
  if(!rec||stack.indexOf(rec)<0)return;
  if(!force&&rec.guard&&rec.guard()===false)return;
  stack.splice(stack.indexOf(rec),1);rec.el.remove();
  if(!stack.length)document.body.style.overflow='';
  if(rec.onClose)rec.onClose();
  if(rec.from&&document.contains(rec.from))try{rec.from.focus({preventScroll:true});}catch(e){}
}
function top(){return stack[stack.length-1];}
function anchorPos(btn){
  var r=btn.getBoundingClientRect(),w=320,l=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),t=r.bottom+8;
  return {pl:Math.round(l),pt:Math.round(Math.min(t,innerHeight-200))};
}
function confirmBox(o){
  var id='cf'+Date.now();
  var rec=openLayer('dialog','<h2 class="h2" id="'+id+'">'+esc(o.title)+'</h2>'+(o.body?'<div class="muted">'+o.body+'</div>':'')+
   '<div class="btns"><button class="btn secondary" data-cancel data-autofocus>'+esc(o.cancel||'Hủy')+'</button><button class="btn '+(o.safe?'primary':'danger-solid')+'" data-ok>'+esc(o.ok)+'</button></div>',{label:id});
  $('[data-cancel]',rec.el).onclick=function(){closeLayer(rec,true);if(o.onCancel)o.onCancel();};
  $('[data-ok]',rec.el).onclick=function(){closeLayer(rec,true);o.onOk();};
  return rec;
}

var IM={items:null,info:null,mode:'merge',err:'',name:''};
function parseCsv(text){
  text=text.replace(/^﻿/,'');var rows=[],row=[],cell='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}return rows.filter(function(r){return r.some(function(x){return x!=='';});});
}
function catByName(type,name){var f=CATS[type].filter(function(c){return c.name.toLowerCase()===String(name).trim().toLowerCase()||c.id===String(name).trim();});return f[0]?f[0].id:null;}
function normTx(o){
  var type=o.type==='thu'?'income':o.type==='chi'?'expense':o.type;
  var amount=typeof o.amount==='string'?parseInt(o.amount.replace(/[^\d]/g,''),10):o.amount;
  var cat=CAT[o.category]&&CAT[o.category].type===type?o.category:catByName(type,o.category);
  var t={id:o.id&&String(o.id)||uid(),type:type,amount:amount,category:cat,date:String(o.date||'').slice(0,10),note:String(o.note||'').slice(0,120),createdAt:o.createdAt||Date.now(),updatedAt:o.updatedAt||Date.now()};
  return validTx(t)?t:null;
}
function parseImport(text,name){
  var raw=[],bad=0;text=text.trim();
  if(!text)return {err:'Chưa có nội dung để nhập.'};
  if(text[0]==='{'||text[0]==='['){
    try{var d=JSON.parse(text);raw=Array.isArray(d)?d:d.transactions;if(!Array.isArray(raw))throw 0;}
    catch(e){return {err:'Tệp không hợp lệ. Hãy chọn tệp .json hoặc .csv do Sổ Thu Chi xuất ra.'};}
  }else{
    var rows=parseCsv(text);if(rows.length<2)return {err:'Tệp không hợp lệ. Hãy chọn tệp .json hoặc .csv do Sổ Thu Chi xuất ra.'};
    var hd=rows[0].map(function(x){return x.trim().toLowerCase();});
    if(hd.indexOf('date')<0||hd.indexOf('amount')<0)return {err:'Tệp không hợp lệ. Hãy chọn tệp .json hoặc .csv do Sổ Thu Chi xuất ra.'};
    raw=rows.slice(1).map(function(r){var o={};hd.forEach(function(h,i){o[h]=r[i];});return o;});
  }
  var items=[],dup=0,keys={};
  var sig=function(t){return [t.type,t.amount,t.category,t.date,t.note].join('|');};
  var ids={};S.tx.forEach(function(t){ids[t.id]=1;keys[sig(t)]=1;});
  raw.forEach(function(o){var t=o&&normTx(o);if(!t){bad++;return;}
    if(ids[t.id]||keys[sig(t)]){dup++;return;}ids[t.id]=1;keys[sig(t)]=1;items.push(t);});
  return {items:items,total:raw.length,dup:dup,bad:bad,name:name};
}

   (IM.err?'<p class="err" role="alert" style="border-radius:8px">'+ic('alert',16)+esc(IM.err)+'</p>':'')+
   (p&&!IM.err?'<div class="prev" aria-live="polite"><div class="li">'+ic('file',18)+'<b>'+esc(p.name||'Nội dung đã dán')+'</b></div><div class="li">'+ic('check',16)+'Tìm thấy '+p.items.length+' khoản hợp lệ</div>'+
    (p.dup?'<div class="li" style="color:var(--warning)">'+ic('warn',16)+'<span style="color:var(--text)">'+p.dup+' khoản trùng sẽ được bỏ qua</span></div>':'')+
    (p.bad?'<div class="li" style="color:var(--danger)">'+ic('alert',16)+'<span style="color:var(--text)">'+p.bad+' khoản lỗi sẽ bị bỏ qua</span></div>':'')+'</div>'+
    '<div class="grp"><button class="radio" role="radio" aria-checked="'+(IM.mode==='merge')+'" data-action="im-mode" data-v="merge"><span class="rb">'+(IM.mode==='merge'?ic('check',12):'')+'</span><span><b>Gộp</b><br><span class="cap muted">Giữ dữ liệu hiện có, bỏ khoản trùng</span></span></button>'+
    '<button class="radio" role="radio" aria-checked="'+(IM.mode==='replace')+'" data-action="im-mode" data-v="replace"><span class="rb">'+(IM.mode==='replace'?ic('check',12):'')+'</span><span><b>Thay thế toàn bộ</b><br><span class="cap muted">Xóa dữ liệu hiện có rồi nhập</span></span></button></div>':'')+
   '</div><div class="panel-ft stack"><button class="btn secondary" data-action="close-top">Hủy</button><button class="btn primary" data-action="im-go"'+(p&&!IM.err&&p.items.length?'':' disabled')+'>Nhập</button></div>';
}
function openImport(){IM={items:null,info:null,mode:'merge',err:'',name:''};var r=openLayer('modal',importHtml(),{label:'it'});r.kindName='import';bindImport(r);}
function refreshImport(r){var keep=$('#im-text',r.el);var v=keep?keep.value:'';$('.panel',r.el).innerHTML='<div class="grab"></div>'+importHtml();$('#im-text',r.el).value=v;bindImport(r);}
function bindImport(r){
  var f=$('#im-file',r.el),d=$('#drop',r.el);
  f.onchange=function(){if(f.files[0])readFile(f.files[0],r);};
  ['dragenter','dragover'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.remove('over');});});
  d.addEventListener('drop',function(e){var fl=e.dataTransfer&&e.dataTransfer.files[0];if(fl)readFile(fl,r);});
}
function readFile(file,r){
  var rd=new FileReader();rd.onload=function(){doParse(String(rd.result),file.name,r);};rd.onerror=function(){IM.err='Không đọc được tệp.';refreshImport(r);};rd.readAsText(file);
}
function doParse(text,name,r){var res=parseImport(text,name);if(res.err){IM.err=res.err;IM.info=null;}else{IM.err='';IM.info=res;if(!res.items.length&&!res.bad&&!res.dup)IM.err='Không có khoản hợp lệ để nhập.';}refreshImport(r);}

/* Dữ liệu mẫu */
function loadSample(){
  var cur=todayStr().slice(0,7),prev=addMonths(cur,-1),td=+todayStr().slice(8);
  var T=[[1,'income','luong',15000000,'Lương tháng'],[2,'expense','nha-o',3500000,'Tiền phòng'],[3,'expense','an-uong',55000,'Ăn trưa'],[3,'expense','di-chuyen',12000,'Xe buýt'],
   [5,'expense','mua-sam',420000,'Áo sơ mi'],[6,'expense','an-uong',38000,'Cà phê'],[8,'expense','giai-tri',180000,'Xem phim'],[9,'expense','an-uong',95000,'Ăn tối cùng bạn'],
   [11,'expense','suc-khoe',250000,'Thuốc cảm'],[12,'income','thu-nhap-phu',800000,'Dạy kèm'],[14,'expense','hoc-tap',350000,'Sách tiếng Anh'],[15,'expense','an-uong',62000,'Bún bò'],
   [17,'expense','di-chuyen',150000,'Đổ xăng'],[19,'expense','an-uong',45000,'Cà phê'],[21,'expense','giai-tri',120000,'Game'],[23,'expense','mua-sam',230000,'Đồ gia dụng'],
   [25,'income','thuong',1000000,'Thưởng dự án'],[26,'expense','an-uong',55000,'Ăn trưa'],[28,'expense','di-chuyen',12000,'Xe buýt']];
  var now=Date.now(),k=0;
  [[cur,1],[prev,1.1]].forEach(function(p){T.forEach(function(r){
    var lim=p[0]===cur?Math.min(td,daysIn(cur)):daysIn(p[0]);if(r[0]>lim)return;
    S.tx.push({id:uid(),type:r[1],amount:Math.round(r[3]*p[1]/1000)*1000,category:r[2],date:p[0]+'-'+pad(r[0]),note:r[4],createdAt:now+(k++),updatedAt:now,sample:true});});});
  if(!monthTx(cur).length)S.ym=prev;
  saveData();renderAll();toast('Đã nạp dữ liệu mẫu');
}

/* ===== Sự kiện ===== */
var actions={
 add:function(){openEntry();},
 edit:function(b){var sw=b.closest('.swipe');closeSwipes();openEntry(b.dataset.id);},
 del:function(b){closeSwipes();deleteTx(b.dataset.id,false);},
 'm-prev':function(){S.ym=addMonths(S.ym,-1);renderAll();},
 'm-next':function(){if(S.ym<todayStr().slice(0,7)){S.ym=addMonths(S.ym,1);renderAll();}},
 'm-pick':function(b){openPicker(b);},
 'y-prev':function(){pickYear--;refreshPicker();},'y-next':function(){if(pickYear<+todayStr().slice(0,4)){pickYear++;refreshPicker();}},
 'm-set':function(b){S.ym=b.dataset.v;closeLayer(top(),true);renderAll();},
 'goto-now':function(){S.ym=todayStr().slice(0,7);closeLayer(top(),true);renderAll();},
 goto:function(b){S.ym=b.dataset.v;renderAll();},
 'bar-mode':function(b){S.bar=b.dataset.v;renderCharts();},
 'tbl-pie':function(){S.tblPie=!S.tblPie;renderCharts();},'tbl-bar':function(){S.tblBar=!S.tblBar;renderCharts();},
 ftype:function(b){S.filter.type=b.dataset.v;pruneCats();renderList();},
 'ftype-p':function(b){S.filter.type=b.dataset.v;pruneCats();renderList();var r=top();if(r&&r.refresh)r.refresh();},
 fcat:function(b){toggleCat(b.dataset.v);renderList();var r=top();if(r&&r.refresh)r.refresh();},
 'fcat-rm':function(b){toggleCat(b.dataset.v);renderList();},
 fclear:function(){S.filter={type:'all',cats:[]};renderList();},
 'fclear-p':function(){S.filter={type:'all',cats:[]};renderList();var r=top();if(r&&r.refresh)r.refresh();},
 filter:function(b){openFilter(b);},
 qscope:function(b){S.qScope=b.dataset.v;renderList();},
 'search-open':function(){S.searchOpen=true;document.body.classList.add('search-open');setTimeout(function(){$('#q').focus();},0);},
 'search-close':function(){S.searchOpen=false;document.body.classList.remove('search-open');setQ('');},
 'search-clear':function(){setQ('');if(innerWidth>=640)$('#q').focus();},
 settings:function(){openSettings();},
 theme:function(b){S.meta.theme=b.dataset.v;saveMeta();applyTheme();var r=top();$('.panel',r.el).innerHTML='<div class="grab"></div>'+settingsHtml();},
 export:function(){openExport();},import:function(){openImport();},
 'x-fmt':function(b){X.fmt=b.dataset.v;refreshExport(top());},'x-scope':function(b){X.scope=b.dataset.v;refreshExport(top());},
 'x-dl':function(){var t=exportText(),ext=X.fmt==='json'?'json':'csv';download('so-thu-chi_'+todayStr()+'.'+ext,t,X.fmt==='json'?'application/json':'text/csv;charset=utf-8');markBackup();toast('Đã xuất '+exportRows().length+' khoản. Nếu trình duyệt chặn tải xuống, hãy dùng nút Sao chép.',null,null,7000);},
 'x-copy':function(){var t=exportText();var done=function(){markBackup();toast('Đã sao chép '+exportRows().length+' khoản');};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){selOut();});else selOut();
   function selOut(){var o=$('#x-out',top().el);o.focus();o.select();toast('Đã chọn nội dung. Nhấn Ctrl/Cmd+C để sao chép.');}},
 'im-pick':function(){$('#im-file',top().el).click();},
 'im-read':function(){var r=top();doParse($('#im-text',r.el).value,'',r);},
 'im-mode':function(b){IM.mode=b.dataset.v;refreshImport(top());},
 'im-go':function(){
   var items=IM.info.items,go=function(){
     if(IM.mode==='replace')S.tx=items.slice();else S.tx=S.tx.concat(items);
     S.corrupt=false;if(!saveData()){toast('Không thể lưu dữ liệu đã nhập');}
     while(stack.length)closeLayer(top(),true);S.ym=todayStr().slice(0,7);renderAll();toast('Đã nhập '+items.length+' khoản');};
   if(IM.mode==='replace')confirmBox({title:'Thay thế toàn bộ dữ liệu hiện có?',body:'Không thể hoàn tác.',ok:'Thay thế',onOk:go});else go();},
 wipe:function(){confirmBox({title:'Xóa toàn bộ dữ liệu?',body:'Toàn bộ '+S.tx.length+' khoản sẽ bị xóa. Hãy xuất dữ liệu trước nếu cần. Không thể hoàn tác.',ok:'Xóa hết',onOk:function(){S.tx=[];S.corrupt=false;saveData();while(stack.length)closeLayer(top(),true);renderAll();toast('Đã xóa toàn bộ dữ liệu');}});},
 snooze:function(){S.meta.snooze=Date.now()+7*864e5;saveMeta();renderBanners();},
 'clear-sample':function(){S.tx=S.tx.filter(function(t){return !t.sample;});saveData();renderAll();toast('Đã xóa dữ liệu mẫu');},
 sample:function(){loadSample();},
 'f-close':function(){closeLayer(FL);},
 'f-type':function(b){if(F.type===b.dataset.v)return;F.type=b.dataset.v;if(F.category&&CAT[F.category].type!==F.type){F.category='';F.resetHint=true;}syncForm();},
 'f-cat':function(b){F.category=b.dataset.v;F.resetHint=false;setErr('e-cat','');syncForm();},
 'f-day':function(b){F.date=addDays(todayStr(),+b.dataset.v);setErr('e-date','');syncForm();},
 'f-save':function(){saveForm();},
 'f-del':function(){deleteTx(F.id,true);},
 'close-top':function(){closeLayer(top());},
 scrim:function(){closeLayer(top());},
 'toast-act':function(){var f=toastAct;$('#toast').classList.remove('show');if(f)f();}
};
function refreshPicker(){var r=top();$('.panel',r.el).innerHTML='<div class="grab"></div>'+pickerHtml(pickYear);}
function pruneCats(){var t=S.filter.type;if(t==='all')return;S.filter.cats=S.filter.cats.filter(function(id){return CAT[id].type===t;});}
function toggleCat(id){var i=S.filter.cats.indexOf(id);if(i>=0)S.filter.cats.splice(i,1);else S.filter.cats.push(id);}
function setQ(v){S.q=v;$('#q').value=v;$('#qclear').hidden=!v;renderList();}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b){return;}
  var fn=actions[b.dataset.action];if(!fn)return;
  if(b.dataset.action!=='toast-act'&&b.dataset.action!=='scrim')hideTip();
  fn(b,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;$('#qclear').hidden=!t.value;clearTimeout(input._t);input._t=setTimeout(renderList,200);return;}
  if(!F||!FL)return;
  if(t.id==='f-amt'){F.amount=digits(t.value);t.value=fmtDigits(F.amount);setErr('e-amt','');}
  else if(t.id==='f-date'){F.date=t.value;setErr('e-date','');}
  else if(t.id==='f-note'){F.note=t.value;noteCount();setErr('e-note','');}
  if(F.id)$('#f-save',FL.el).disabled=!formDirty();
});
function input(){}
document.addEventListener('focusout',function(e){
  if(!F||!FL)return;var id=e.target.id;
  if(id==='f-amt'){var n=+F.amount;setErr('e-amt',F.amount&&!(n>0)?'Nhập số tiền lớn hơn 0':'');}
});
document.addEventListener('keydown',function(e){
  var r=top();
  if(e.key==='Escape'){
    if(r){e.preventDefault();closeLayer(r);return;}
    if(document.activeElement===$('#q')){if(S.q){setQ('');}else if(S.searchOpen){actions['search-close']();}$('#q').blur();return;}
  }
  if(e.key==='Tab'&&r){
    var f=$$('button:not([disabled]),input:not([disabled]):not([hidden]),textarea,[href],select',$('.panel',r.el)).filter(function(x){return x.offsetParent!==null;});
    if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
    else if(!$('.panel',r.el).contains(document.activeElement)){e.preventDefault();a.focus();}
  }
  if(e.key==='Enter'&&F&&FL&&top()===FL){
    var t=e.target;if(t.tagName==='TEXTAREA'&&e.shiftKey)return;
    if(t.closest&&t.closest('#eform')&&t.tagName!=='BUTTON'){e.preventDefault();saveForm();}
  }
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||r||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'&&innerWidth>=640){e.preventDefault();$('#q').focus();}
  if((e.key==='n'||e.key==='N')&&innerWidth>=1024&&S.tx.length>=0){e.preventDefault();openEntry();}
});

/* Tooltip biểu đồ */
document.addEventListener('pointermove',function(e){
  var t=e.target.closest&&e.target.closest('[data-tip]');
  if(t)showTip(e,t.getAttribute('data-tip'));else if(!$('#tip').hidden&&e.pointerType==='mouse')hideTip();
});
document.addEventListener('pointerdown',function(e){
  var t=e.target.closest&&e.target.closest('[data-tip]');
  if(t&&e.pointerType!=='mouse')showTip(e,t.getAttribute('data-tip'));else hideTip();
});
window.addEventListener('scroll',hideTip,{passive:true});

/* Vuốt dòng (điện thoại) */
var sw=null;
function closeSwipes(){$$('.row').forEach(function(r){r.style.transform='';});}
document.addEventListener('touchstart',function(e){
  var row=e.target.closest&&e.target.closest('.row');
  if(!row){closeSwipes();return;}
  var t=e.touches[0];sw={row:row,x:t.clientX,y:t.clientY,open:row.style.transform!=='',dx:0,lock:null};
  $$('.row').forEach(function(r){if(r!==row)r.style.transform='';});
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!sw)return;var t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(sw.lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(sw.lock!=='x')return;
  var base=sw.open?-144:0,v=Math.max(-144,Math.min(0,base+dx));sw.row.classList.add('drag');sw.row.style.transform='translateX('+v+'px)';sw.dx=v;
},{passive:true});
document.addEventListener('touchend',function(){
  if(!sw)return;var r=sw.row;r.classList.remove('drag');
  if(sw.lock==='x')r.style.transform=sw.dx<-60?'translateX(-144px)':'';
  sw=null;
});

/* Kích thước & mạng */
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){if(S.tx.length&&!S.tblBar)renderCharts();},150);});
function net(){$('#off').hidden=navigator.onLine!==false;}
window.addEventListener('online',net);window.addEventListener('offline',net);

/* ===== Khởi động ===== */
loadMeta();applyTheme();initStatic();loadData();net();
renderAll();
if(S.corrupt){
  var cr=openLayer('dialog','<span style="color:var(--danger)">'+ic('alert',28)+'</span><h2 class="h2" id="cr">Không đọc được dữ liệu</h2><div class="muted">Dữ liệu lưu trên máy bị lỗi. Bạn có thể khôi phục từ tệp sao lưu hoặc bắt đầu lại.</div>'+
   '<div class="btns" style="flex-direction:column-reverse"><button class="btn danger-solid" data-ok2>Bắt đầu lại</button><button class="btn primary" data-imp data-autofocus>Nhập từ tệp sao lưu</button></div>',{label:'cr'});
  $('[data-imp]',cr.el).onclick=function(){closeLayer(cr,true);openImport();};
  $('[data-ok2]',cr.el).onclick=function(){confirmBox({title:'Xóa toàn bộ dữ liệu hiện có?',body:'Không thể hoàn tác.',ok:'Xóa hết',onOk:function(){closeLayer(cr,true);S.corrupt=false;S.tx=[];saveData();renderAll();},onCancel:function(){}});};
  cr.el.querySelector('.scrim').dataset.action='noop';
}
window.__sotc=S;
})();
